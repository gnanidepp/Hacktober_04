[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "A local, extensible policy gateway for AI agent filesystem tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.45,<2",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in real Gemma inference"]

